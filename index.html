<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Arcade Hub: Jogo da Velha com IA minimax, 2048, Snake, Campo Minado, Tetris, Termo e Block Strike (FPS 5x5 com bots), feitos em HTML, CSS e JavaScript puros.">
  <meta property="og:title" content="Arcade Hub">
  <meta property="og:description" content="Sete jogos em JavaScript puro, sem dependências e sem build.">
  <meta property="og:type" content="website">
  <title>Arcade Hub — Sete jogos em JavaScript puro</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/games/tictactoe.css">
  <link rel="stylesheet" href="css/games/game2048.css">
  <link rel="stylesheet" href="css/games/snake.css">
  <link rel="stylesheet" href="css/games/minesweeper.css">
  <link rel="stylesheet" href="css/games/tetris.css">
  <link rel="stylesheet" href="css/games/termo.css">
  <link rel="stylesheet" href="css/games/blockstrike.css">
</head>
<body>
  <canvas id="confetti-canvas"></canvas>

  <button id="menu-toggle-btn" class="hamburger-btn" aria-label="Abrir menu de jogos" aria-expanded="false" title="Menu de jogos">
    <span class="hamburger-bar"></span>
    <span class="hamburger-bar"></span>
    <span class="hamburger-bar"></span>
  </button>

  <div id="drawer-backdrop" class="drawer-backdrop"></div>

  <aside id="sidebar-drawer" class="sidebar-drawer" aria-label="Menu lateral de navegação">
    <div class="drawer-header">
      <div class="drawer-logo">
        <div class="logo-icon">⚡</div>
        <div class="logo-text">
          <h2>Arcade Hub</h2>
          <span>Jogos clássicos</span>
        </div>
      </div>
      <button id="drawer-close-btn" class="drawer-close-btn" aria-label="Fechar menu">&times;</button>
    </div>

    <nav class="drawer-nav">
      <div class="nav-section-title">Coleção de jogos</div>
    </nav>

    <div class="drawer-footer">
      <div class="drawer-quick-settings">
        <button id="drawer-sound-toggle" class="drawer-btn">
          <span class="sound-icon-drawer">🔊</span>
          <span class="sound-label-drawer">Efeitos sonoros</span>
        </button>
      </div>
      <p class="drawer-credits">7 jogos • feito em JS puro</p>
    </div>
  </aside>

  <main class="app-container" id="app"></main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
